<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan-Viewer</title>
<style>
  :root { --bg: #0e1116; --panel: #151a21; --line: #262d38; --ink: #e8ebef; --dim: #8b95a3; --acc: #5fd3c4; --warn: #ffb43c; --err: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; }
  body { display: grid; grid-template-columns: 320px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; letter-spacing: .06em; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  #drop { margin: 14px 18px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--dim); cursor: pointer; transition: border-color .2s, background .2s; }
  #drop.over { border-color: var(--acc); background: rgba(95,211,196,.06); color: var(--ink); }
  #drop b { color: var(--ink); }
  #list { flex: 1; overflow: auto; padding: 0 10px 10px; }
  .item { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
  .item:hover { background: rgba(255,255,255,.03); }
  .item.active { border-color: var(--acc); background: rgba(95,211,196,.07); }
  .item .n { font-weight: 600; word-break: break-all; }
  .item .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .item .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(95,211,196,.15); color: var(--acc); margin-left: 6px; }
  .opts { border-top: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 10px; }
  .opts label { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--dim); }
  .opts input[type=range] { width: 130px; accent-color: var(--acc); }
  .opts select { background: #222a35; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  .opts output { width: 34px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--ink); background: #222a35; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3a4554; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--acc); color: #071512; border-color: var(--acc); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  main { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #seg { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(21,26,33,.92); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  #seg button { border: 0; background: none; padding: 7px 14px; border-radius: 6px; color: var(--dim); }
  #seg button.on { background: #2a3340; color: var(--ink); }
  #status { position: absolute; left: 14px; bottom: 14px; background: rgba(21,26,33,.92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--dim); max-width: 60%; }
  #status.err { color: var(--err); }
  #info { position: absolute; right: 14px; bottom: 14px; background: rgba(21,26,33,.92); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--dim); display: none; min-width: 210px; }
  #info b { color: var(--ink); font-weight: 600; }
  #help { position: absolute; right: 14px; top: 14px; color: var(--dim); font-size: 12px; text-align: right; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--acc); transform-origin: 0 50%; transform: scaleX(0); transition: transform .2s; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<aside>
  <header><h1>SCAN-VIEWER</h1><p>Gaussian-Splat- und Punktwolken-PLY · lokal auf diesem Rechner</p></header>
  <div id="drop" tabindex="0"><b>PLY hierher ziehen</b><br>oder klicken zum Auswählen<input id="file" type="file" accept=".ply" multiple hidden></div>
  <div id="list"></div>
  <div class="opts">
    <label>Suchradius <span><input id="radius" type="range" min="1" max="8" step="0.5" value="2.5"> <output id="radius-o">2.5</output></span></label>
    <label>Mindest-Deckkraft <span><input id="minop" type="range" min="0.02" max="0.5" step="0.02" value="0.1"> <output id="minop-o">0.10</output></span></label>
    <label><span>Mehrere Objekte</span><select id="group"><option value="auto">automatisch</option><option value="1">ja (Gruppe)</option><option value="0">nein</option></select></label>
    <label><span>Bereinigen (Floater, Fetzen)</span><input id="clean" type="checkbox" checked></label>
    <label><span>Mesh + Lücken schließen</span><input id="mkmesh" type="checkbox" checked></label>
    <label><span>Weiche Rand-Splats behalten</span><input id="soft" type="checkbox" checked></label>
    <button class="primary" id="run" disabled>Extrahieren</button>
    <div class="row"><button id="dl-ex" disabled>Splats</button><button id="dl-mesh" disabled>Mesh</button><button id="dl-or" disabled>Original</button></div>
  </div>
</aside>
<main>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="empty">Noch kein Scan geladen</div>
  <div id="seg"><button data-v="original" class="on">Original</button><button data-v="extracted" disabled>Extrahiert</button><button data-v="both" disabled>Überlagert</button><button data-v="mesh" disabled>Mesh</button><button data-v="wire" disabled>Mesh-Gitter</button></div>
  <div id="help">Ziehen: drehen · Rechts/Shift: verschieben · Rad: zoomen · F: einpassen</div>
  <div id="status">Bereit.</div>
  <div id="info"></div>
</main>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "./spark.module.js"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
